<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Зажги звёзды для Ширы</title>
        <style>
            body {
                margin: 0;
                overflow: hidden;
                background: #1e1e2f;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                font-family: -apple-system, Arial, sans-serif;
                user-select: none;
            }
            canvas {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 1;
            }
            .text {
                position: relative;
                z-index: 2;
                color: #ffffff;
                font-size: 8vw;
                font-weight: bold;
                text-align: center;
                text-shadow: 0 0 15px rgba(255, 255, 255, 0.7);
                padding: 20px;
                max-width: 90%;
                white-space: pre-line;
                transition: all 0.4s ease;
            }
            .text.final {
                font-size: 6vw;
            }
        </style>
    </head>
    <body>
        <canvas id="canvas"></canvas>
        <div class="text" id="greeting">Коснись звёзд!</div>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
        <script>
            const canvas = document.getElementById('canvas')
            const ctx = canvas.getContext('2d')
            const greeting = document.getElementById('greeting')

            let particles = []
            const PARTICLE_COUNT = 400
            let tapCount = 0
            let interactionEnded = false
            let targets22 = []
            let heartPoints = []
            let stage = 'chaos'

            const neonWhite = '#E0FFFF'
            const startColors = ['#FFB6C1', '#ADD8E6', '#98FF98']

            function resizeCanvas() {
                canvas.width = window.innerWidth
                canvas.height = window.innerHeight
            }

            class Particle {
                constructor(i) {
                    this.index = i
                    this.reset()
                    this.size = Math.random() * 1.5 + 1.5
                    this.opacity = 0.6
                    this.color =
                        startColors[
                            Math.floor(Math.random() * startColors.length)
                        ]
                }
                reset() {
                    this.x = Math.random() * canvas.width
                    this.y = Math.random() * canvas.height
                    this.speedX = Math.random() * 2 - 1
                    this.speedY = Math.random() * 2 - 1
                }
                update() {
                    switch (stage) {
                        case 'chaos':
                        case 'final':
                            this.x += this.speedX
                            this.y += this.speedY
                            if (this.x < 0 || this.x > canvas.width)
                                this.speedX *= -1
                            if (this.y < 0 || this.y > canvas.height)
                                this.speedY *= -1
                            break
                        case 'forming22':
                            this.moveTo(targets22[this.index])
                            break
                        case 'scatter':
                            this.x += this.speedX
                            this.y += this.speedY
                            break
                        case 'heart':
                            this.moveTo(heartPoints[this.index])
                            break
                        case 'glow':
                            this.opacity = Math.min(1, this.opacity + 0.01)
                            this.color = neonWhite
                            break
                    }
                }
                moveTo(target) {
                    if (!target) return
                    const dx = target.x - this.x
                    const dy = target.y - this.y
                    this.x += dx / 10
                    this.y += dy / 10
                }
                draw() {
                    ctx.fillStyle = this.color
                    ctx.globalAlpha = this.opacity
                    ctx.beginPath()
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2)
                    ctx.fill()
                }
            }

            function getDigit2Points(scale = 20, offsetX = 0, offsetY = 0) {
                const points = []
                const base = [
                    [0, 0],
                    [1, 0],
                    [2, 0],
                    [3, 1],
                    [3, 2],
                    [2, 3],
                    [1, 4],
                    [0, 5],
                    [0, 6],
                    [1, 6],
                    [2, 6],
                    [3, 6],
                ]
                for (let [x, y] of base) {
                    for (let dx = 0; dx <= 1; dx++) {
                        for (let dy = 0; dy <= 1; dy++) {
                            points.push({
                                x: (x + dx) * scale + offsetX,
                                y: (y + dy) * scale + offsetY,
                            })
                        }
                    }
                }
                return points
            }

            function generate22Targets() {
                const total = []
                const scale = canvas.width / 50
                const offsetY = canvas.height / 2 - scale * 3
                const offsetLeft = canvas.width / 2 - scale * 9
                const offsetRight = canvas.width / 2 + scale

                const left2 = getDigit2Points(scale, offsetLeft, offsetY)
                const right2 = getDigit2Points(scale, offsetRight, offsetY)
                total.push(...left2, ...right2)

                while (total.length < PARTICLE_COUNT) {
                    total.push(total[Math.floor(Math.random() * total.length)])
                }
                targets22 = total.slice(0, PARTICLE_COUNT)
            }

            function generateHeart() {
                const points = []
                const centerX = canvas.width / 2
                const centerY = canvas.height / 2
                const scale = canvas.width / 80 // меньше масштаб для плотности

                let count = 0
                while (points.length < PARTICLE_COUNT && count < 10000) {
                    count++
                    const t = Math.random() * Math.PI * 2
                    const r = Math.sqrt(Math.random())
                    const x = 16 * Math.pow(Math.sin(t), 3) * r
                    const y =
                        (13 * Math.cos(t) -
                            5 * Math.cos(2 * t) -
                            2 * Math.cos(3 * t) -
                            Math.cos(4 * t)) *
                        r

                    points.push({
                        x: centerX + x * scale,
                        y: centerY - y * scale,
                    })
                }

                heartPoints = points.slice(0, PARTICLE_COUNT)
            }

            function initParticles() {
                particles = []
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    particles.push(new Particle(i))
                }
            }

            function animateParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height)
                ctx.globalAlpha = 1
                particles.forEach((p) => {
                    p.update()
                    p.draw()
                })
                requestAnimationFrame(animateParticles)
            }

            function handleTap() {
                if (interactionEnded) return

                tapCount++
                if (tapCount === 1) {
                    greeting.textContent = 'Зажги их все!'
                }

                if (tapCount < 3) {
                    particles.forEach((p) => {
                        p.speedX *= 1.8
                        p.speedY *= 1.8
                    })
                    const intensity = tapCount * 0.3 + 0.7
                    greeting.style.color = neonWhite
                    greeting.style.textShadow = `0 0 ${
                        10 + tapCount * 10
                    }px rgba(224,255,255,${intensity})`
                }

                if (tapCount === 3) {
                    interactionEnded = true
                    gsap.to(greeting, { opacity: 0, duration: 0.5 })

                    stage = 'forming22'
                    setTimeout(() => {
                        stage = 'scatter'
                        particles.forEach((p) => {
                            p.speedX = (Math.random() - 0.5) * 8
                            p.speedY = (Math.random() - 0.5) * 8
                        })
                    }, 2000)

                    setTimeout(() => {
                        stage = 'heart'
                    }, 3500)
                    setTimeout(() => {
                        stage = 'glow'
                    }, 5000)
                    setTimeout(() => {
                        stage = 'final'
                        greeting.textContent =
                            'Шира, с Днём Рождения!\nТы — моё сияние!'
                        greeting.classList.add('final')
                        greeting.style.color = neonWhite
                        greeting.style.textShadow = `0 0 30px rgba(224,255,255,1)`
                        gsap.fromTo(
                            greeting,
                            { opacity: 0, y: 40 },
                            { opacity: 1, y: 0, duration: 1 }
                        )

                        particles.forEach((p) => {
                            p.speedX = (Math.random() - 0.5) * 4
                            p.speedY = (Math.random() - 0.5) * 4
                        })
                    }, 7000)
                }
            }

            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault()
                handleTap()
            })

            resizeCanvas()
            generate22Targets()
            generateHeart()
            initParticles()
            animateParticles()
            window.addEventListener('resize', () => {
                resizeCanvas()
                generate22Targets()
                generateHeart()
            })
        </script>
    </body>
</html>
